table: payments
description: Contains payment transactions associated with subscriptions

fields:
  - name: payment_id
    type: integer
    description: Unique identifier for each payment
    role: entity

  - name: subscription_id
    type: integer
    description: Links each payment to a subscription
    role: relationship
    related_table: subscriptions
    related_field: subscription_id

  - name: payment_date
    type: date
    description: The date when the payment was made
    role: dimension

  - name: amount_usd
    type: numeric
    description: Payment amount in USD
    role: measure

  - name: method
    type: string
    description: Payment method used for the transaction
    role: dimension

measures:
  - name: total_revenue
    formula: SUM(amount_usd)
    description: Total revenue generated from all payments

  - name: average_payment_amount
    formula: AVG(amount_usd)
    description: Average payment amount in USD

  - name: total_payments
    formula: COUNT(payment_id)
    description: Total number of payment records

golden_queries:
  - name: revenue_by_payment_method
    description: Total revenue grouped by payment method
    sql: |
      SELECT method, SUM(amount_usd) AS total_revenue
      FROM payments
      GROUP BY method;

  - name: revenue_by_plan_last_30_days
    description: Total revenue by subscription plan over the last 30 days
    sql: |
      SELECT s.plan, SUM(p.amount_usd) AS total_revenue
      FROM payments p
      JOIN subscriptions s ON p.subscription_id = s.subscription_id
      WHERE p.payment_date >= CURRENT_DATE - INTERVAL '30 days'
      GROUP BY s.plan;