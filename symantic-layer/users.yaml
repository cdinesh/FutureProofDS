table: users
description: Contains user profile and signup information

fields:
  - name: user_id
    type: integer
    description: Unique identifier for each user
    role: entity

  - name: signup_date
    type: date
    description: The date when the user signed up
    role: dimension

  - name: country
    type: string
    description: Country associated with the user
    role: dimension

  - name: device_type
    type: string
    description: Primary device type used by the user
    role: dimension

measures:
  - name: total_users
    formula: COUNT(user_id)
    description: Total number of users

golden_queries:
  - name: users_by_country
    description: Total users grouped by country
    sql: |
      SELECT country, COUNT(user_id) AS total_users
      FROM users
      GROUP BY country;

  - name: users_by_device_type
    description: Total users grouped by device type
    sql: |
      SELECT device_type, COUNT(user_id) AS total_users
      FROM users
      GROUP BY device_type;